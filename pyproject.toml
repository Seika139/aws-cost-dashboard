[project]
name = "aws-cost-dashboard"
version = "0.1.0"
description = "AWS multi-account cost dashboard"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.43.62",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.1"]
