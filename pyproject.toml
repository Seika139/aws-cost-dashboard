[project]
name = "aws-cost-dashboard"
version = "0.1.0"
description = "AWS multi-account cost dashboard"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.43.56",
  "fastapi>=0.140.0",
  "uvicorn[standard]>=0.51.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.0"]
