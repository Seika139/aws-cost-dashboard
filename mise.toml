[tools]
python = "3.12"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
uv = "latest"
yamllint = "latest"

[tasks.grant-permissions]
description = "mise/ 内のシェルスクリプトに実行権限を付与して mise から実行できるようにする"
quiet = true
run = [
  "test -d .mise/tasks && find .mise/tasks -name '*.sh' -exec chmod +x {} +",
]

[tasks.serve]
description = "ダッシュボードを起動する"
quiet = true
run = "uv run uvicorn src.main:app --host 0.0.0.0 --port 8100"

[tasks.sso-login]
description = "SSO login (opens browser for authentication)"
quiet = true
run = "uv run python -c 'from src.auth import sso_login_interactive; sso_login_interactive()'"

##########################
# Cost Explorer Prefetch #
##########################

[tasks.prefetch-cost]
description = "Cost Explorer データを SQLite キャッシュに事前取得する"
quiet = true
run = "env -u AWS_PROFILE -u AWS_REGION -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN -u AWS_SECURITY_TOKEN AWS_EC2_METADATA_DISABLED=true uv run python -m src.prefetch"

[tasks.prefetch-dashboard-default]
description = "ダッシュボードのデフォルトアカウントを事前取得する (24 か月分の月次データ + 4 か月分の日次データ)"
quiet = true
run = "mise run prefetch-cost -- --preset dashboard-default"

#####################
# Development tasks #
#####################

[tasks.dev]
description = "ダッシュボードをホットリロードで起動する (開発用)"
quiet = true
run = "uv run uvicorn src.main:app --host 0.0.0.0 --port 8100 --reload"

[tasks.test]
description = "テストを実行する"
quiet = true
run = "uv run pytest tests/ -v"
